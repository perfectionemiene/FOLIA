<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Book — Folia</title>
  
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Page Header */
    .page-header {
      margin-bottom: 2rem;
    }

    /* Tab Switcher */
    .tab-container {
      display: flex;
      gap: 1rem;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 2rem;
    }

    .tab-btn {
      padding: 0.8rem 1.25rem;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: var(--transition-smooth, all 0.2s ease);
    }

    .tab-btn.active {
      color: var(--color-accent);
      border-bottom-color: var(--color-accent);
      font-weight: 600;
    }

    /* Form & Input Layout */
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-card, 12px);
      padding: 2rem;
      box-shadow: var(--shadow-soft);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.25rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .form-group.full-width {
      grid-column: span 2;
    }

    label {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-main);
    }

    /* Search Results List */
    .search-results {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .result-item {
      display: flex;
      gap: 1.25rem;
      padding: 1.25rem;
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-card, 12px);
      align-items: center;
    }

    .result-cover {
      width: 60px;
      height: 85px;
      background: #E5E0D8;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-secondary);
      flex-shrink: 0;
      overflow: hidden;
    }

    .result-details {
      flex: 1;
    }

    .result-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--color-primary);
    }

    .result-author {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }

    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-group.full-width { grid-column: span 1; }
      .result-item { flex-direction: column; align-items: flex-start; }
      .result-item button { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- Mobile Top Header Bar -->
    <div class="mobile-header">
      <a href="../index.html" class="sidebar-brand">
        <i data-lucide="sprout"></i> Folia
      </a>
      <button type="button" class="mobile-nav-toggle" id="mobileNavToggle" aria-label="Toggle Navigation">
        <i data-lucide="menu"></i>
      </button>
    </div>

    <!-- Mobile Sidebar Drawer Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="appSidebar">
      <div>
        <div class="sidebar-top">
          <a href="../index.html" class="sidebar-brand">
            <i data-lucide="sprout"></i> Folia
          </a>
          <button type="button" class="mobile-nav-close" id="mobileNavClose" aria-label="Close Navigation">
            <i data-lucide="x"></i>
          </button>
        </div>

        <ul class="nav-menu">
          <li class="nav-item"><a href="dashboard.html"><i data-lucide="layout-dashboard"></i> Dashboard</a></li>
          <li class="nav-item"><a href="library.html"><i data-lucide="book-open"></i> Library</a></li>
          <li class="nav-item active"><a href="add-book.html"><i data-lucide="plus-circle"></i> Add Book</a></li>
          <li class="nav-item"><a href="analytics.html"><i data-lucide="bar-chart-3"></i> Analytics</a></li>
          <li class="nav-item"><a href="goals.html"><i data-lucide="target"></i> Goals</a></li>
          <li class="nav-item"><a href="profile.html"><i data-lucide="user"></i> Profile</a></li>
        </ul>
      </div>

      <div>
        <ul class="nav-menu">
          <li class="nav-item"><a href="settings.html"><i data-lucide="settings"></i> Settings</a></li>
          <li class="nav-item"><a href="../index.html"><i data-lucide="log-out"></i> Sign Out</a></li>
        </ul>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      
      <header class="page-header">
        <h1>Add a New Book</h1>
        <p style="color: var(--text-muted); margin-top: 0.25rem;">Expand your library by searching or creating a manual record.</p>
      </header>

      <!-- Mode Selector Tabs -->
      <div class="tab-container">
        <button type="button" class="tab-btn active" id="searchTab">
          <i data-lucide="search" style="width:18px;"></i> Search Google Books
        </button>
        <button type="button" class="tab-btn" id="manualTab">
          <i data-lucide="pen-tool" style="width:18px;"></i> Add Manually
        </button>
      </div>

      <!-- Google Books API Search Section -->
      <section id="searchSection" class="card">
        <div class="form-group full-width">
          <label for="bookSearch">Search by Title, Author, or ISBN</label>
          <div style="display: flex; gap: 0.75rem;">
            <input type="text" id="bookSearch" class="input-field" placeholder="e.g. Deep Work, Cal Newport...">
            <button type="button" class="btn btn-primary" id="searchBtn" style="white-space: nowrap;">
              <i data-lucide="search" style="width:16px;"></i> Search
            </button>
          </div>
        </div>

        <div class="search-results" id="searchResults">
          <p style="color: var(--text-muted); font-size: 0.9rem;">Type a query above to discover books.</p>
        </div>
      </section>

      <!-- Manual Form Section -->
      <section id="manualSection" class="card" style="display: none;">
        <form id="manualBookForm">
          <div class="form-grid">
            
            <div class="form-group full-width">
              <label for="title">Book Title *</label>
              <input type="text" id="title" class="input-field" placeholder="e.g. Four Thousand Weeks" required>
            </div>

            <div class="form-group">
              <label for="author">Author *</label>
              <input type="text" id="author" class="input-field" placeholder="e.g. Oliver Burkeman" required>
            </div>

            <div class="form-group">
              <label for="genre">Genre / Category</label>
              <input type="text" id="genre" class="input-field" placeholder="e.g. Philosophy, Productivity">
            </div>

            <div class="form-group">
              <label for="pages">Total Pages</label>
              <input type="number" id="pages" class="input-field" placeholder="300" min="1">
            </div>

            <div class="form-group">
              <label for="status">Reading Status</label>
              <select id="status" class="select-field">
                <option value="want">Want to Read</option>
                <option value="reading">Currently Reading</option>
                <option value="finished">Finished</option>
              </select>
            </div>

            <div class="form-group">
              <label for="bookTags">Tags (comma separated)</label>
              <input type="text" id="bookTags" class="input-field" placeholder="e.g. favorites, productivity, 2026-reads">
            </div>

            <div class="form-group full-width">
              <label for="notes">Initial Thoughts / Notes</label>
              <textarea id="notes" class="textarea-field" placeholder="Why are you starting this book?"></textarea>
            </div>

            <div class="form-group full-width">
              <label for="quote">Favorite Quote</label>
              <input type="text" id="quote" class="input-field" placeholder="“Enter a quote that resonated...”">
            </div>

          </div>

          <div style="margin-top: 1.75rem; display: flex; justify-content: flex-end; gap: 1rem;">
            <a href="library.html" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Save to Library</button>
          </div>
        </form>
      </section>

    </main>
  </div>

  <script src="../js/app.js"></script>
  <script>
    let searchResultsCache = [];

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      initMobileNav();
      initTabs();
      initBookSearch();
      initManualForm();
    });

    // Mobile Navigation Toggle
    function initMobileNav() {
      const toggleBtn = document.getElementById('mobileNavToggle');
      const closeBtn = document.getElementById('mobileNavClose');
      const sidebar = document.getElementById('appSidebar');
      const overlay = document.getElementById('sidebarOverlay');

      const openMenu = () => {
        sidebar?.classList.add('open');
        overlay?.classList.add('active');
      };

      const closeMenu = () => {
        sidebar?.classList.remove('open');
        overlay?.classList.remove('active');
      };

      toggleBtn?.addEventListener('click', openMenu);
      closeBtn?.addEventListener('click', closeMenu);
      overlay?.addEventListener('click', closeMenu);
    }

    // Utility: XSS Protection
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, match => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[match]));
    }

    // Tab Navigation Logic
    function initTabs() {
      const searchTab = document.getElementById('searchTab');
      const manualTab = document.getElementById('manualTab');
      const searchSection = document.getElementById('searchSection');
      const manualSection = document.getElementById('manualSection');

      searchTab?.addEventListener('click', () => {
        searchTab.classList.add('active');
        manualTab.classList.remove('active');
        searchSection.style.display = 'block';
        manualSection.style.display = 'none';
      });

      manualTab?.addEventListener('click', () => {
        manualTab.classList.add('active');
        searchTab.classList.remove('active');
        manualSection.style.display = 'block';
        searchSection.style.display = 'none';
      });
    }

    // Google Books Search Logic
    function initBookSearch() {
      const searchInput = document.getElementById('bookSearch');
      const searchBtn = document.getElementById('searchBtn');
      const resultsContainer = document.getElementById('searchResults');

      async function searchBooks(query) {
        if (!query.trim()) {
          resultsContainer.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">Type a query above to discover books.</p>';
          return;
        }
        
        resultsContainer.innerHTML = '<p style="color: var(--text-muted);">Searching books...</p>';

        try {
          const response = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(query)}&maxResults=5`);
          const data = await response.json();

          if (!data.items || data.items.length === 0) {
            resultsContainer.innerHTML = '<p style="color: var(--text-muted);">No books found matching your search.</p>';
            searchResultsCache = [];
            return;
          }

          searchResultsCache = data.items;

          resultsContainer.innerHTML = data.items.map((item, index) => {
            const info = item.volumeInfo;
            const title = escapeHtml(info.title || 'Untitled');
            const authors = escapeHtml(info.authors ? info.authors.join(', ') : 'Unknown Author');
            const pages = info.pageCount ? `${info.pageCount} pages` : 'N/A';
            const category = escapeHtml(info.categories ? info.categories[0] : 'General');
            const description = escapeHtml(info.description ? info.description.substring(0, 110) + '...' : 'No description available.');
            
            let thumbnail = info.imageLinks?.thumbnail || '';
            if (thumbnail.startsWith('http:')) {
              thumbnail = thumbnail.replace('http:', 'https:');
            }

            return `
              <div class="result-item">
                <div class="result-cover">
                  ${thumbnail ? `<img src="${thumbnail}" alt="${title}" style="width:100%; height:100%; object-fit:cover;">` : '<i data-lucide="book" style="width:28px;"></i>'}
                </div>
                <div class="result-details">
                  <div class="result-title">${title}</div>
                  <div class="result-author">${authors} • ${pages} • ${category}</div>
                  <p style="font-size: 0.85rem; color: var(--text-muted);">${description}</p>
                </div>
                <button type="button" class="btn btn-secondary" onclick="addApiBook(${index})">
                  <i data-lucide="plus" style="width:16px;"></i> Add
                </button>
              </div>
            `;
          }).join('');

          lucide.createIcons();
        } catch (error) {
          resultsContainer.innerHTML = '<p style="color: var(--color-error, #D9534F);">Error fetching books. Please check your network connection.</p>';
        }
      }

      searchBtn?.addEventListener('click', () => searchBooks(searchInput.value));

      searchInput?.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          searchBooks(searchInput.value);
        }
      });

      let debounceTimer;
      searchInput?.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
          if (searchInput.value.trim().length >= 3) {
            searchBooks(searchInput.value);
          }
        }, 400);
      });
    }

    // Save Google Books API Search Result
    function addApiBook(index) {
      const item = searchResultsCache[index]?.volumeInfo;
      if (!item) return;

      let coverUrl = item.imageLinks?.thumbnail || '';
      if (coverUrl.startsWith('http:')) {
        coverUrl = coverUrl.replace('http:', 'https:');
      }

      const newBook = {
        title: item.title || 'Untitled',
        author: item.authors ? item.authors.join(', ') : 'Unknown Author',
        category: item.categories ? item.categories[0] : 'General',
        pages: item.pageCount || 0,
        status: 'want',
        cover: coverUrl,
        tags: [item.categories ? item.categories[0].toLowerCase() : 'imported'],
        notes: item.description || '',
        quote: ''
      };

      if (typeof addBookToLibrary === 'function') {
        addBookToLibrary(newBook);
      }
      window.location.href = 'library.html';
    }

    // Save Manual Form Data
    function initManualForm() {
      const manualForm = document.getElementById('manualBookForm');

      manualForm?.addEventListener('submit', (e) => {
        e.preventDefault();

        const rawTags = document.getElementById('bookTags').value;
        const tags = rawTags.split(',').map(tag => tag.trim().toLowerCase()).filter(Boolean);

        const newBook = {
          title: document.getElementById('title').value.trim(),
          author: document.getElementById('author').value.trim(),
          category: document.getElementById('genre').value.trim() || 'General',
          pages: parseInt(document.getElementById('pages').value, 10) || 0,
          status: document.getElementById('status').value || 'want',
          tags: tags,
          notes: document.getElementById('notes').value.trim(),
          quote: document.getElementById('quote').value.trim()
        };

        if (typeof addBookToLibrary === 'function') {
          addBookToLibrary(newBook);
        }
        window.location.href = 'library.html';
      });
    }
  </script>
</body>
</html>
