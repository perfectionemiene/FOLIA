<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading — Folia</title>

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="../js/storage.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      background: var(--reader-bg, #FAF9F6); 
      color: var(--reader-text, #222222); 
      font-family: var(--font-body, Georgia, serif);
      line-height: 1.85;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* Reader Theme Support */
    body.theme-sepia {
      --reader-bg: #F4EFE6;
      --reader-text: #433422;
      --reader-border: #E2D7C5;
    }

    body.theme-dark {
      --reader-bg: #1A1A1A;
      --reader-text: #E0E0E0;
      --reader-border: #333333;
    }

    body.font-sm .reading-content p { font-size: 1rem; }
    body.font-md .reading-content p { font-size: 1.15rem; }
    body.font-lg .reading-content p { font-size: 1.35rem; }

    /* Minimalist Top Bar */
    .reader-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1.5rem;
      background: var(--bg-surface, #ffffff);
      border-bottom: 1px solid var(--reader-border, #eeeeee);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: var(--text-main, #333);
      font-weight: 600;
      font-size: 0.95rem;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .book-meta-header {
      text-align: center;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .book-title-header {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main, #111);
    }

    .book-author-header {
      font-size: 0.75rem;
      color: var(--text-muted, #666);
    }

    .reader-tools {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .tool-btn {
      background: transparent;
      border: 1px solid var(--reader-border, #ddd);
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      color: var(--text-main, #333);
    }

    /* Reading Canvas */
    .reader-container {
      max-width: 680px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 6rem 1.5rem;
      flex: 1;
      width: 100%;
    }

    .chapter-title {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 2rem;
      color: var(--reader-text, #111);
      font-family: system-ui, -apple-system, sans-serif;
    }

    .reading-content p {
      margin-bottom: 1.5rem;
      text-align: justify;
      hyphens: auto;
    }

    /* Floating Reader Controls Bar at Bottom */
    .reader-bottombar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: var(--bg-surface, #ffffff);
      border-top: 1px solid var(--reader-border, #eeeeee);
      padding: 0.85rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: system-ui, -apple-system, sans-serif;
      z-index: 100;
    }

    .btn-page {
      background: var(--bg-main, #f4f4f4);
      border: 1px solid var(--reader-border, #e0e0e0);
      padding: 0.5rem 1.25rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-main, #333);
    }

    .btn-page:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .progress-text {
      font-size: 0.85rem;
      color: var(--text-muted, #666);
      font-weight: 500;
    }

    @media (max-width: 600px) {
      .reader-container { padding: 1.5rem 1rem 5rem 1rem; }
      .reading-content p { text-align: left; }
      .chapter-title { font-size: 1.35rem; }
      .book-meta-header { display: none; }
    }
  </style>
</head>
<body class="font-md">

  <!-- Minimal Navigation Bar -->
  <header class="reader-topbar">
    <a href="library.html" id="backToBookBtn" class="btn-back">
      <i data-lucide="arrow-left" style="width:18px;"></i> Library
    </a>

    <div class="book-meta-header">
      <div class="book-title-header" id="readerBookTitle">Loading...</div>
      <div class="book-author-header" id="readerBookAuthor">by ...</div>
    </div>

    <div class="reader-tools">
      <button class="tool-btn" id="themeToggleBtn" title="Toggle Theme">
        <i data-lucide="sun" style="width:16px;"></i> Theme
      </button>
      <button class="tool-btn" id="fontSizeBtn" title="Adjust Font Size">
        <i data-lucide="type" style="width:16px;"></i>
      </button>
    </div>
  </header>

  <!-- Clean Reading Viewport -->
  <main class="reader-container">
    <h1 class="chapter-title" id="chapterTitle">Chapter 1</h1>
    
    <article class="reading-content" id="chapterBody">
      <p>Loading reader content...</p>
    </article>
  </main>

  <!-- Bottom Page Navigation -->
  <footer class="reader-bottombar">
    <button class="btn-page" id="prevPageBtn">Previous</button>
    <span class="progress-text" id="pageIndicator">Page 1 of 1</span>
    <button class="btn-page" id="nextPageBtn">Next</button>
  </footer>

  <script src="../js/app.js"></script>
  <script>
    let currentBook = null;
    let libraryData = [];
    let currentPage = 1;
    let totalPages = 100;
    const fontSizes = ['font-sm', 'font-md', 'font-lg'];
    let fontSizeIndex = 1;

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      initReader();
      setupControls();
    });

    function initReader() {
      // Fetch user's stored library
      libraryData = typeof getLibrary === 'function' 
        ? getLibrary() 
        : (JSON.parse(localStorage.getItem('folia_library')) || []);

      const urlParams = new URLSearchParams(window.location.search);
      const bookId = urlParams.get('id');
      const titleParam = urlParams.get('book');
      const authorParam = urlParams.get('author');

      // Match target book
      if (bookId) {
        currentBook = libraryData.find(b => String(b.id) === String(bookId));
      } else if (titleParam) {
        const decodedTitle = decodeURIComponent(titleParam);
        currentBook = libraryData.find(b => b.title?.toLowerCase() === decodedTitle.toLowerCase());
      }

      // Fallback object if opening reader directly without prior library entry
      if (!currentBook) {
        currentBook = {
          id: bookId || Date.now(),
          title: titleParam ? decodeURIComponent(titleParam) : 'Atomic Habits',
          author: authorParam ? decodeURIComponent(authorParam) : 'James Clear',
          currentPage: 1,
          totalPages: 320,
          status: 'reading'
        };
      }

      currentPage = Math.max(1, Number(currentBook.currentPage) || 1);
      totalPages = Math.max(1, Number(currentBook.totalPages || currentBook.pages) || 100);

      // Set header details
      document.getElementById('readerBookTitle').textContent = currentBook.title;
      document.getElementById('readerBookAuthor').textContent = `by ${currentBook.author}`;

      // Update back button target to point directly to details page
      const backBtn = document.getElementById('backToBookBtn');
      if (backBtn) {
        backBtn.href = `book-details.html?id=${encodeURIComponent(currentBook.id)}&book=${encodeURIComponent(currentBook.title)}&author=${encodeURIComponent(currentBook.author)}`;
      }

      renderPageContent();
    }

    function renderPageContent() {
      // Derive Chapter Number based on progress
      const chapterNum = Math.ceil(currentPage / 15);
      document.getElementById('chapterTitle').textContent = `Chapter ${chapterNum}: ${currentBook.title}`;

      const chapterBody = document.getElementById('chapterBody');
      
      // Dynamic content generator based on book notes or synthesized pages
      if (currentBook.contentPages && currentBook.contentPages[currentPage - 1]) {
        chapterBody.innerHTML = `<p>${currentBook.contentPages[currentPage - 1]}</p>`;
      } else {
        chapterBody.innerHTML = `
          <p>You are reading page <strong>${currentPage}</strong> of <em>${currentBook.title}</em> by ${currentBook.author}.</p>
          <p>${currentBook.notes ? `<strong>Saved Note Preview:</strong> ${currentBook.notes}` : 'Every small daily reading milestone brings you closer to completing your goals. Consistency compounds over time.'}</p>
          <p>Focus on capturing key takeaways and enjoying the process of steady learning.</p>
        `;
      }

      // Update Page Indicator text
      document.getElementById('pageIndicator').textContent = `Page ${currentPage} of ${totalPages}`;

      // Toggle button states
      document.getElementById('prevPageBtn').disabled = currentPage <= 1;
      document.getElementById('nextPageBtn').disabled = currentPage >= totalPages;

      // Sync and persist updated progress back to LocalStorage
      syncReadingProgress();
    }

    function syncReadingProgress() {
      currentBook.currentPage = currentPage;
      
      // Auto-mark completed if last page reached
      if (currentPage >= totalPages) {
        currentBook.status = 'completed';
      } else if (currentBook.status === 'want-to-read') {
        currentBook.status = 'reading';
      }

      const index = libraryData.findIndex(b => String(b.id) === String(currentBook.id));
      if (index !== -1) {
        libraryData[index] = currentBook;
      } else {
        libraryData.push(currentBook);
      }

      localStorage.setItem('folia_library', JSON.stringify(libraryData));
    }

    function setupControls() {
      // Page Controls
      document.getElementById('prevPageBtn').addEventListener('click', () => {
        if (currentPage > 1) {
          currentPage--;
          renderPageContent();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      });

      document.getElementById('nextPageBtn').addEventListener('click', () => {
        if (currentPage < totalPages) {
          currentPage++;
          renderPageContent();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      });

      // Theme Switcher (Light -> Sepia -> Dark)
      const themes = ['', 'theme-sepia', 'theme-dark'];
      let themeIdx = 0;
      document.getElementById('themeToggleBtn').addEventListener('click', () => {
        document.body.classList.remove(themes[themeIdx]);
        themeIdx = (themeIdx + 1) % themes.length;
        if (themes[themeIdx]) document.body.classList.add(themes[themeIdx]);
      });

      // Font Size Switcher
      document.getElementById('fontSizeBtn').addEventListener('click', () => {
        document.body.classList.remove(fontSizes[fontSizeIndex]);
        fontSizeIndex = (fontSizeIndex + 1) % fontSizes.length;
        document.body.classList.add(fontSizes[fontSizeIndex]);
      });
    }
  </script>
</body>
</html>
