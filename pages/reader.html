<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading — Folia</title>

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#1A1A1A">

  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Load JSZip FIRST before epub.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/epub.js/0.3.88/epub.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
  <script src="../js/storage.js"></script>

  <!-- PDF.js Text Layer Styling for Selectable Text -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf_viewer.min.css">

  <style>
    body {
      background: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .reader-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.5rem;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-left, .header-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .book-meta-title {
      font-weight: 700;
      font-size: 1rem;
      color: var(--color-primary);
      text-align: center;
    }

    .book-meta-author {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
    }

    .control-dropdown {
      position: relative;
    }

    .dropdown-menu {
      position: absolute;
      top: 120%;
      right: 0;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-card, 12px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      padding: 1rem;
      width: 220px;
      display: none;
      flex-direction: column;
      gap: 0.75rem;
      z-index: 200;
    }

    .dropdown-menu.open {
      display: flex;
    }

    .theme-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
    }

    .theme-btn {
      padding: 0.5rem;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      text-align: center;
    }

    .theme-btn.light { background: #FFFFFF; color: #1A1A1A; }
    .theme-btn.sepia { background: #F4EBE1; color: #4A3E3D; }
    .theme-btn.dark { background: #1A1A1A; color: #F5F5F7; }

    .reader-main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    #viewer {
      width: 100%;
      max-width: 800px;
      height: 75vh;
      background: var(--bg-surface);
      border-radius: var(--radius-card, 12px);
      box-shadow: var(--shadow-soft);
      overflow: hidden;
      position: relative;
    }

    /* PDF Wrapper & Text Layer */
    #pdfContainer {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: auto;
      display: flex;
      justify-content: center;
    }

    .pdf-page-wrapper {
      position: relative;
      display: inline-block;
      margin: auto;
    }

    .textLayer {
      position: absolute;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      opacity: 0.25;
      line-height: 1.0;
    }

    .reader-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.5rem;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-color);
    }

    .progress-bar-container {
      flex: 1;
      max-width: 400px;
      margin: 0 1rem;
      text-align: center;
    }

    .progress-bar {
      height: 6px;
      background: var(--bg-main);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 0.3rem;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--color-accent);
      transition: width 0.3s ease;
    }

    @media (max-width: 600px) {
      .book-meta-author { display: none; }
      .reader-main { padding: 0.5rem; }
      #viewer { height: 80vh; }
    }
  </style>
</head>
<body class="theme-light">

  <header class="reader-header">
    <div class="header-left">
      <a href="library.html" class="btn btn-secondary" style="padding:0.4rem 0.75rem; font-size:0.85rem;">
        <i data-lucide="arrow-left" style="width:16px;"></i> Library
      </a>
    </div>

    <div>
      <div class="book-meta-title" id="bookTitleDisplay">Reading</div>
      <div class="book-meta-author" id="bookAuthorDisplay">Folia Reader</div>
    </div>

    <div class="header-right">
      <div class="control-dropdown">
        <button class="btn btn-secondary" id="themeDropdownToggle" style="padding:0.4rem 0.75rem; font-size:0.85rem;">
          <i data-lucide="sun" style="width:16px;"></i> Theme
        </button>
        <div class="dropdown-menu" id="themeMenu">
          <label style="font-size:0.8rem; font-weight:600; color:var(--text-muted);">Appearance</label>
          <div class="theme-options">
            <button class="theme-btn light" onclick="setReaderTheme('light')">Light</button>
            <button class="theme-btn sepia" onclick="setReaderTheme('sepia')">Sepia</button>
            <button class="theme-btn dark" onclick="setReaderTheme('dark')">Dark</button>
          </div>
        </div>
      </div>

      <div class="control-dropdown">
        <button class="btn btn-secondary" id="textDropdownToggle" style="padding:0.4rem 0.75rem; font-size:0.85rem;">
          <i data-lucide="type" style="width:16px;"></i>
        </button>
        <div class="dropdown-menu" id="textMenu">
          <label style="font-size:0.8rem; font-weight:600; color:var(--text-muted);">Font Size</label>
          <div style="display:flex; gap:0.5rem;">
            <button class="btn btn-secondary" style="flex:1" onclick="adjustFontSize(-10)">A-</button>
            <button class="btn btn-secondary" style="flex:1" onclick="adjustFontSize(10)">A+</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="reader-main">
    <div id="viewer"></div>
  </main>

  <footer class="reader-footer">
    <button class="btn btn-secondary" id="prevPageBtn">
      <i data-lucide="chevron-left" style="width:18px;"></i> Previous
    </button>

    <div class="progress-bar-container">
      <span style="font-size:0.85rem; font-weight:600;" id="pageProgressText">Loading book...</span>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <button class="btn btn-secondary" id="nextPageBtn">
      Next <i data-lucide="chevron-right" style="width:18px;"></i>
    </button>
  </footer>

  <script src="../js/app.js"></script>
  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    }

    let rendition = null;
    let bookInstance = null;
    let pdfDoc = null;
    let pdfCurrentPage = 1;
    let currentFontSize = 100;
    let bookId = null;

    document.addEventListener('DOMContentLoaded', async () => {
      lucide.createIcons();
      initDropdowns();
      await loadReaderBook();
    });

    const urlParams = new URLSearchParams(window.location.search);
    bookId = urlParams.get('id');
    const bookTitle = urlParams.get('book') || 'Untitled Book';
    const bookAuthor = urlParams.get('author') || 'Unknown Author';

    document.getElementById('bookTitleDisplay').textContent = bookTitle;
    document.getElementById('bookAuthorDisplay').textContent = `by ${bookAuthor}`;

    function initDropdowns() {
      const themeToggle = document.getElementById('themeDropdownToggle');
      const textToggle = document.getElementById('textDropdownToggle');
      const themeMenu = document.getElementById('themeMenu');
      const textMenu = document.getElementById('textMenu');

      themeToggle?.addEventListener('click', (e) => {
        e.stopPropagation();
        textMenu?.classList.remove('open');
        themeMenu?.classList.toggle('open');
      });

      textToggle?.addEventListener('click', (e) => {
        e.stopPropagation();
        themeMenu?.classList.remove('open');
        textMenu?.classList.toggle('open');
      });

      document.addEventListener('click', () => {
        themeMenu?.classList.remove('open');
        textMenu?.classList.remove('open');
      });
    }

    async function loadReaderBook() {
      if (!bookId) {
        showError('No book ID specified in URL.');
        return;
      }

      let rawStored = null;
      if (typeof getBookFile === 'function') {
        try {
          rawStored = await getBookFile(bookId);
        } catch (err) {
          console.error("IndexedDB Retrieval Error:", err);
        }
      }

      if (!rawStored) {
        showError('No file binary found in storage. Delete this book entry and re-upload it in Add Book.');
        return;
      }

      try {
        let arrayBuffer;

        if (rawStored instanceof ArrayBuffer) {
          arrayBuffer = rawStored;
        } else if (rawStored instanceof Blob || rawStored instanceof File) {
          arrayBuffer = await rawStored.arrayBuffer();
        } else if (typeof rawStored === 'string' && rawStored.startsWith('data:')) {
          // Legacy fallback: base64 data URL
          const base64Str = rawStored.split(',')[1];
          const binaryStr = window.atob(base64Str);
          const len = binaryStr.length;
          const bytes = new Uint8Array(len);
          for (let i = 0; i < len; i++) {
            bytes[i] = binaryStr.charCodeAt(i);
          }
          arrayBuffer = bytes.buffer;
        } else {
          throw new Error('Unrecognized stored format');
        }

        const userData = getUserData();
        const currentBook = userData.books?.find(b => String(b.id) === String(bookId));

        // Magic-byte sniff: PDFs start with "%PDF" (0x25 0x50 0x44 0x46)
        const header = new Uint8Array(arrayBuffer.slice(0, 4));
        const isPdfMagic = header[0] === 0x25 && header[1] === 0x50 &&
                           header[2] === 0x44 && header[3] === 0x46;

        const isPdf = currentBook?.format === 'pdf' || isPdfMagic;

        if (isPdf) {
          await renderPdfWithTextLayer(arrayBuffer);
        } else {
          await renderEpubBook(arrayBuffer);
        }

      } catch (err) {
        console.error("Error initializing reader:", err);
        showError("Failed to parse book file. Delete and re-upload the file in Add Book.");
      }
    }

    async function renderEpubBook(arrayBuffer) {
      document.getElementById('viewer').innerHTML = '';

      // Convert ArrayBuffer -> Uint8Array -> Blob.
      // epub.js 0.3.88 parses Blobs reliably; raw ArrayBuffers often fail
      // with "Failed to parse book file" because it misdetects the format.
      const uint8 = new Uint8Array(arrayBuffer);
      const blob = new Blob([uint8], { type: 'application/epub+zip' });

      bookInstance = ePub(blob);

      rendition = bookInstance.renderTo("viewer", {
        width: "100%",
        height: "100%",
        flow: "paginated"
      });

      try {
        await bookInstance.ready;
        await rendition.display();
      } catch (e) {
        console.error('EPUB render failed:', e);
        showError('This EPUB could not be rendered. It may be DRM-protected or corrupted.');
        return;
      }

      bookInstance.locations.generate(1000).then(() => {
        updateProgressText();
      });

      rendition.on("relocated", (location) => {
        updateProgressText(location);
      });

      document.getElementById('prevPageBtn').onclick = () => rendition?.prev();
      document.getElementById('nextPageBtn').onclick = () => rendition?.next();
    }

    async function renderPdfWithTextLayer(arrayBuffer) {
      const viewer = document.getElementById('viewer');
      viewer.innerHTML = `
        <div id="pdfContainer">
          <div class="pdf-page-wrapper" id="pdfPageWrapper">
            <canvas id="pdfCanvas"></canvas>
            <div id="textLayerContainer" class="textLayer"></div>
          </div>
        </div>
      `;

      pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      await drawPdfPage(pdfCurrentPage);

      document.getElementById('prevPageBtn').onclick = () => {
        if (pdfCurrentPage > 1) {
          pdfCurrentPage--;
          drawPdfPage(pdfCurrentPage);
        }
      };

      document.getElementById('nextPageBtn').onclick = () => {
        if (pdfCurrentPage < pdfDoc.numPages) {
          pdfCurrentPage++;
          drawPdfPage(pdfCurrentPage);
        }
      };
    }

    async function drawPdfPage(pageNum) {
      if (!pdfDoc) return;

      const page = await pdfDoc.getPage(pageNum);
      const canvas = document.getElementById('pdfCanvas');
      const textLayerDiv = document.getElementById('textLayerContainer');
      const wrapper = document.getElementById('pdfPageWrapper');

      if (!canvas || !textLayerDiv) return;

      const ctx = canvas.getContext('2d');
      const viewport = page.getViewport({ scale: 1.2 });

      canvas.height = viewport.height;
      canvas.width = viewport.width;
      wrapper.style.width = viewport.width + 'px';
      wrapper.style.height = viewport.height + 'px';

      textLayerDiv.innerHTML = '';

      await page.render({ canvasContext: ctx, viewport }).promise;

      const textContent = await page.getTextContent();
      pdfjsLib.renderTextLayer({
        textContent: textContent,
        container: textLayerDiv,
        viewport: viewport,
        textDivs: []
      });

      const totalPages = pdfDoc.numPages;
      const progressPercent = Math.round((pageNum / totalPages) * 100);

      document.getElementById('pageProgressText').textContent = `Page ${pageNum} of ${totalPages} (${progressPercent}%)`;
      document.getElementById('progressFill').style.width = `${progressPercent}%`;
    }

    function setReaderTheme(themeName) {
      document.body.className = `theme-${themeName}`;
      if (rendition) {
        if (themeName === 'dark') {
          rendition.themes.default({ body: { background: '#1A1A1A !important', color: '#F5F5F7 !important' } });
        } else if (themeName === 'sepia') {
          rendition.themes.default({ body: { background: '#F4EBE1 !important', color: '#4A3E3D !important' } });
        } else {
          rendition.themes.default({ body: { background: '#FFFFFF !important', color: '#1A1A1A !important' } });
        }
      }
    }

    function adjustFontSize(delta) {
      currentFontSize = Math.max(70, Math.min(180, currentFontSize + delta));
      if (rendition) rendition.themes.fontSize(`${currentFontSize}%`);
    }

    function showError(msg) {
      document.getElementById('viewer').innerHTML = `
        <div style="padding:2.5rem; text-align:center;">
          <i data-lucide="alert-circle" style="width:36px; height:36px; color:#e53e3e; margin-bottom:0.75rem;"></i>
          <h4 style="font-size:1.1rem; margin-bottom:0.4rem;">Unable to Open Book</h4>
          <p style="color:var(--text-muted); font-size:0.9rem; max-width:400px; margin:0 auto 1.25rem auto;">${msg}</p>
          <a href="add-book.html" class="btn btn-secondary" style="font-size:0.85rem; display:inline-flex; align-items:center; gap:0.4rem;">
            <i data-lucide="plus-circle" style="width:16px;"></i> Re-upload Book
          </a>
        </div>
      `;
      lucide.createIcons();
      document.getElementById('pageProgressText').textContent = 'Error';
    }

    function updateProgressText(location) {
      if (!bookInstance || !bookInstance.locations) return;

      const totalPages = bookInstance.locations.total || 0;
      let currentPage = 1;

      if (location && location.start) {
        currentPage = bookInstance.locations.locationFromCfi(location.start.cfi) || 1;
      }

      const progressPercent = totalPages > 0 ? Math.round((currentPage / totalPages) * 100) : 0;

      document.getElementById('pageProgressText').textContent = totalPages > 0
        ? `Page ${currentPage} of ${totalPages} (${progressPercent}%)`
        : `Reading Progress: ${progressPercent}%`;

      document.getElementById('progressFill').style.width = `${progressPercent}%`;
    }
  </script>
</body>
</html>
