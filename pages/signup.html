<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Folia — Create Account</title>
  
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="../js/storage.js"></script>

  <style>
    /* CSS Variables & Theme Fallbacks */
    :root {
      --bg-main: #F8F9FA;
      --bg-surface: #FFFFFF;
      --text-main: #212529;
      --text-muted: #6C757D;
      --border-color: #E9ECEF;
      --color-primary: #1A1A1A;
      --color-accent: #B87333;
      --radius-card: 16px;
      --radius-input: 10px;
      --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.05);
      --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .onboarding-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-card);
      padding: 2.5rem;
      width: 100%;
      max-width: 500px;
      box-shadow: var(--shadow-soft);
    }

    .brand-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--color-primary);
      margin-bottom: 0.4rem;
    }

    .tagline {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    /* Progress Indicator */
    .step-indicator {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }

    .step-dot {
      width: 32px;
      height: 5px;
      border-radius: 3px;
      background: var(--border-color);
      transition: all 0.3s ease;
    }

    .step-dot.active {
      background: var(--color-accent);
      width: 48px;
    }

    /* Steps */
    .form-step {
      display: none;
    }

    .form-step.active {
      display: block;
    }

    .step-title {
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--color-primary);
      margin-bottom: 0.4rem;
    }

    .step-desc {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }

    label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .input-field {
      width: 100%;
      padding: 0.85rem 1rem;
      font-family: inherit;
      font-size: 0.95rem;
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-input);
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease;
    }

    .input-field:focus {
      border-color: var(--color-accent);
      background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(184, 115, 51, 0.12);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.85rem 1.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: var(--radius-input);
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--color-primary);
      color: #FFFFFF;
    }

    .btn-primary:hover {
      background: #333333;
    }

    .btn-secondary {
      background: var(--bg-main);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background: #E9ECEF;
    }

    .genre-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .genre-chip {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.85rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-input);
      background: var(--bg-main);
      cursor: pointer;
      font-size: 0.9rem;
      user-select: none;
      transition: all 0.2s ease;
    }

    .genre-chip input[type="checkbox"] {
      display: none;
    }

    .genre-chip.selected {
      border-color: var(--color-accent);
      background: rgba(184, 115, 51, 0.08);
      color: var(--color-accent);
      font-weight: 600;
    }

    .button-row {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .btn-full {
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="onboarding-card">
    <div class="brand-header">
      <i data-lucide="sprout" style="width:28px; height:28px; color: var(--color-accent);"></i> Folia
    </div>
    <div class="tagline">Personalize your reading journey</div>

    <div class="step-indicator">
      <div class="step-dot active" id="dot1"></div>
      <div class="step-dot" id="dot2"></div>
      <div class="step-dot" id="dot3"></div>
    </div>

    <form id="onboardingForm">
      
      <!-- STEP 1 -->
      <div class="form-step active" id="step1">
        <div class="step-title">Welcome! What should we call you?</div>
        <div class="step-desc">Enter your details to create your local profile.</div>

        <div class="form-group">
          <label for="userName">Full Name / Display Name</label>
          <input type="text" id="userName" class="input-field" placeholder="e.g. Perfection" required>
        </div>

        <div class="form-group">
          <label for="userEmail">Email Address (Optional)</label>
          <input type="email" id="userEmail" class="input-field" placeholder="name@example.com">
        </div>

        <div class="form-group">
          <label for="userBio">Short Bio (Optional)</label>
          <input type="text" id="userBio" class="input-field" placeholder="e.g. Non-fiction lover & lifelong learner">
        </div>

        <div class="button-row">
          <button type="button" class="btn btn-primary btn-full" onclick="nextStep(2)">
            Next: Set Goals <i data-lucide="arrow-right" style="width:16px;"></i>
          </button>
        </div>
      </div>

      <!-- STEP 2 -->
      <div class="form-step" id="step2">
        <div class="step-title">Set your reading targets</div>
        <div class="step-desc">These goals help keep you motivated and on track.</div>

        <div class="form-group">
          <label for="annualGoal">How many books do you want to read this year?</label>
          <input type="number" id="annualGoal" class="input-field" value="12" min="1" max="200" required>
        </div>

        <div class="form-group">
          <label for="dailyMinsGoal">Daily reading goal (minutes)</label>
          <input type="number" id="dailyMinsGoal" class="input-field" value="20" min="5" step="5" required>
        </div>

        <div class="button-row">
          <button type="button" class="btn btn-secondary" onclick="nextStep(1)">Back</button>
          <button type="button" class="btn btn-primary" style="flex:1;" onclick="nextStep(3)">
            Next: Preferences <i data-lucide="arrow-right" style="width:16px;"></i>
          </button>
        </div>
      </div>

      <!-- STEP 3 -->
      <div class="form-step" id="step3">
        <div class="step-title">Select your favorite genres</div>
        <div class="step-desc">Pick a few topics you enjoy reading about.</div>

        <div class="genre-grid">
          <label class="genre-chip">
            <input type="checkbox" name="genres" value="Self-Improvement">
            <i data-lucide="sparkles" style="width:16px;"></i> Self-Improvement
          </label>
          <label class="genre-chip">
            <input type="checkbox" name="genres" value="Philosophy">
            <i data-lucide="compass" style="width:16px;"></i> Philosophy
          </label>
          <label class="genre-chip">
            <input type="checkbox" name="genres" value="Fiction">
            <i data-lucide="book-open" style="width:16px;"></i> Fiction
          </label>
          <label class="genre-chip">
            <input type="checkbox" name="genres" value="Productivity">
            <i data-lucide="zap" style="width:16px;"></i> Productivity
          </label>
          <label class="genre-chip">
            <input type="checkbox" name="genres" value="Finance">
            <i data-lucide="trending-up" style="width:16px;"></i> Finance
          </label>
          <label class="genre-chip">
            <input type="checkbox" name="genres" value="Biography">
            <i data-lucide="user" style="width:16px;"></i> Biography
          </label>
        </div>

        <div class="button-row">
          <button type="button" class="btn btn-secondary" onclick="nextStep(2)">Back</button>
          <button type="submit" class="btn btn-primary" style="flex:1;">
            Complete Setup <i data-lucide="check" style="width:16px;"></i>
          </button>
        </div>
      </div>

    </form>
  </div>

  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();

      document.querySelectorAll('.genre-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          const checkbox = chip.querySelector('input[type="checkbox"]');
          setTimeout(() => {
            if (checkbox.checked) {
              chip.classList.add('selected');
            } else {
              chip.classList.remove('selected');
            }
          }, 10);
        });
      });
    });

    let currentStep = 1;

    function nextStep(stepNumber) {
      if (currentStep === 1 && stepNumber === 2) {
        const nameInput = document.getElementById('userName');
        if (!nameInput.value.trim()) {
          alert('Please enter your name to proceed.');
          nameInput.focus();
          return;
        }
      }

      document.querySelectorAll('.form-step').forEach(step => step.classList.remove('active'));
      document.querySelectorAll('.step-dot').forEach(dot => dot.classList.remove('active'));

      document.getElementById(`step${stepNumber}`).classList.add('active');
      document.getElementById(`dot${stepNumber}`).classList.add('active');
      currentStep = stepNumber;
    }

    document.getElementById('onboardingForm').addEventListener('submit', (e) => {
      e.preventDefault();

      const selectedGenres = Array.from(document.querySelectorAll('input[name="genres"]:checked'))
        .map(input => input.value);

      const newUser = {
        name: document.getElementById('userName').value.trim() || 'Reader',
        email: document.getElementById('userEmail').value.trim(),
        bio: document.getElementById('userBio').value.trim() || 'Avid reader exploring new ideas.',
        readingGoal: parseInt(document.getElementById('annualGoal').value) || 12,
        dailyGoalMins: parseInt(document.getElementById('dailyMinsGoal').value) || 20,
        favoriteGenres: selectedGenres.length > 0 ? selectedGenres : ['General'],
        joinDate: new Date().toLocaleDateString('en-US', { month: 'long', year: 'numeric' }),
        stats: {
          booksCompleted: 0,
          pagesRead: 0,
          currentStreak: 0,
          longestStreak: 0
        },
        currentlyReading: null
      };

      if (typeof saveUser === 'function') {
        saveUser(newUser);
        saveLibrary([]);
      } else {
        localStorage.setItem('folia_user', JSON.stringify(newUser));
        localStorage.setItem('folia_library', JSON.stringify([]));
      }

      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
